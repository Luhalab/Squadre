<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Squadre</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0b1220;--mu:#5b667a;--ac:#1a56db;--hl:#e6efff;--ln:#e3e8f0;--live:#d92d20;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#131c30;--tx:#eef2f9;--mu:#93a0b8;--ac:#6ea0ff;--hl:#1b2a4a;--ln:#24304a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:16px 16px 4px}
h1{margin:0;font-size:22px}
.note{margin:6px 16px 0;padding:6px 10px;border-radius:8px;background:var(--hl);color:var(--ac);font-size:12px}
main{padding:12px 16px 32px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.top b{font-size:17px}.top small{display:block;color:var(--mu)}
.pos{margin-left:auto;text-align:right;font-weight:700}.pos small{display:block;font-weight:400;color:var(--mu)}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}
.row span:first-child{color:var(--mu)}
.live{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--live);color:var(--live);text-decoration:none;font-size:13px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px}
.tabs{display:flex;gap:6px;margin:18px 0 8px}
.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
th{color:var(--mu);font-weight:500;font-size:12px}
tr.me td{background:var(--hl);font-weight:700}
.tw{overflow-x:auto}
</style>
</head>
<body>
<header><h1>Le mie squadre</h1></header>
<div class="note">Dati di esempio: la grafica è una bozza, i numeri non sono reali.</div>
<main>
<div id="cards"></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="card tw"><table id="tbl"></table></div>
</main>
<script>
// Dati finti (solo per la bozza grafica)
const SQ=[
 {id:'inter',n:'Inter',sub:'Serie A',ini:'IN',lega:'A',pos:'1°',pt:'22 pt',next:'Sab 18:00 · Parma (casa)',last:'V 2-0 vs Como',live:false},
 {id:'palermo',n:'Palermo',sub:'Serie B',ini:'PA',lega:'B',pos:'3°',pt:'17 pt',next:'Dom 15:00 · Bari (trasferta)',last:'P 1-1 vs Spezia',live:true,score:"1-0 · 34'"},
 {id:'italia',n:'Italia',sub:'Nations League',ini:'IT',lega:'N',pos:'1°',pt:'6 pt',next:'Ven 20:45 · Francia (casa)',last:'V 3-1 vs Israele',live:false}
];
const TAB={A:{t:'Serie A',me:'Inter',r:[['Inter',22],['Napoli',20],['Juventus',18],['Milan',17],['Roma',15]]},
 B:{t:'Serie B',me:'Palermo',r:[['Venezia',19],['Monza',18],['Palermo',17],['Bari',15],['Spezia',14]]},
 N:{t:'Nations League',me:'Italia',r:[['Italia',6],['Francia',4],['Belgio',3],['Israele',0]]}};
const g=q=>'https://www.google.com/search?q='+encodeURIComponent(q);
document.getElementById('cards').innerHTML=SQ.map(s=>`
<div class="card"><div class="top"><div class="crest">${s.ini}</div>
<div><b>${s.n}</b><small>${s.sub}</small></div>
<div class="pos">${s.pos}<small>${s.pt}</small></div></div>
${s.live?`<div class="row"><span><span class="dot"></span>In corso</span><b>${s.score}</b></div>`:''}
<div class="row"><span>Prossima</span><span>${s.next}</span></div>
<div class="row"><span>Ultima</span><span>${s.last}</span></div>
<a class="live" href="${g(s.n+' partita')}" target="_blank" rel="noopener">Live su Google</a></div>`).join('');
let cur='A';
function draw(){
 const d=TAB[cur];
 document.getElementById('tabs').innerHTML=Object.entries(TAB).map(([k,v])=>
  `<button role="tab" aria-selected="${k===cur}" data-k="${k}">${v.t}</button>`).join('');
 document.getElementById('tbl').innerHTML='<tr><th>#</th><th>Squadra</th><th>Pt</th></tr>'+
  d.r.map((x,i)=>`<tr class="${x[0]===d.me?'me':''}"><td>${i+1}</td><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('');
}
document.getElementById('tabs').addEventListener('click',e=>{const k=e.target.dataset.k;if(k){cur=k;draw()}});
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
