<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Squadre</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0b1220;--mu:#5b667a;--ac:#1a56db;--hl:#e6efff;--ln:#e3e8f0;--live:#d92d20;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#131c30;--tx:#eef2f9;--mu:#93a0b8;--ac:#6ea0ff;--hl:#1b2a4a;--ln:#24304a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:16px 16px 4px}
h1{margin:0;font-size:22px}
.note{margin:6px 16px 0;padding:6px 10px;border-radius:8px;background:var(--hl);color:var(--ac);font-size:12px}
main{padding:12px 16px 32px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.top b{font-size:17px}.top small{display:block;color:var(--mu)}
.pos{margin-left:auto;text-align:right;font-weight:700}.pos small{display:block;font-weight:400;color:var(--mu)}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}
.row span:first-child{color:var(--mu)}
.live{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--live);color:var(--live);text-decoration:none;font-size:13px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px}
.tabs{display:flex;gap:6px;margin:18px 0 8px}
.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
th{color:var(--mu);font-weight:500;font-size:12px}
tr.me td{background:var(--hl);font-weight:700}
.tw{overflow-x:auto}
.src{color:var(--mu);font-size:11px;text-align:center;margin-top:8px}.err{color:var(--live)}
</style>
</head>
<body>
<header><h1>Le mie squadre</h1></header>
<div class="note" id="note" hidden>Dati di esempio: i numeri non sono reali.</div>
<main>
<div id="cards"></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="card tw"><table id="tbl"></table></div>
<div class="src" id="src"></div>
</main>
<script>
const DAY=864e5,iso=ms=>new Date(Date.now()+ms).toISOString();
const DEMO={src:'demo',teams:[
 {id:'inter',name:'Inter',league:'Serie A',pos:1,pts:22,next:{t:iso(2*DAY),home:true,opp:'Parma'},last:{res:'V',score:'2-0',opp:'Como'}},
 {id:'palermo',name:'Palermo',league:'Serie B',pos:3,pts:17,live:{score:'1-0',clock:"34'",opp:'Bari'},next:{t:iso(7*DAY),home:false,opp:'Spezia'},last:{res:'N',score:'1-1',opp:'Cesena'}},
 {id:'italia',name:'Italia',league:'Nations League',pos:1,pts:6,next:{t:iso(9*DAY),home:true,opp:'Francia'},last:{res:'V',score:'3-1',opp:'Israele'}}],
 tables:{A:{title:'Serie A',mine:['Inter'],rows:[[1,'Inter',22],[2,'Napoli',20],[3,'Juventus',18],[4,'Milan',17]]},
  B:{title:'Serie B',mine:['Palermo'],rows:[[1,'Venezia',19],[2,'Monza',18],[3,'Palermo',17],[4,'Bari',15]]},
  N:{title:'Nations League',mine:['Italia'],rows:[[1,'Italia',6],[2,'Francia',4],[3,'Belgio',3],[4,'Israele',0]]}}};
let D=DEMO,err='',cur=null,last=0;
const g=q=>'https://www.google.com/search?q='+encodeURIComponent(q);
const fmt=t=>{const d=new Date(t);return d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})};
const ini=n=>n.slice(0,2).toUpperCase();
function cards(){document.getElementById('cards').innerHTML=D.teams.map(s=>`
<div class="card"><div class="top"><div class="crest">${ini(s.name)}</div>
<div><b>${s.name}</b><small>${s.league||''}</small></div>
<div class="pos">${s.pos?s.pos+'°':'–'}<small>${s.pts!=null?s.pts+' pt':''}</small></div></div>
${s.live?`<div class="row"><span><span class="dot"></span>In corso vs ${s.live.opp}</span><b>${s.live.score} · ${s.live.clock}</b></div>`:''}
<div class="row"><span>Prossima</span><span>${s.next?fmt(s.next.t)+' · '+s.next.opp+(s.next.home?' (casa)':' (trasferta)'):'—'}</span></div>
<div class="row"><span>Ultima</span><span>${s.last?s.last.res+' '+s.last.score+' vs '+s.last.opp:'—'}</span></div>
<a class="live" href="${g(s.name+' partita')}" target="_blank" rel="noopener">Live su Google</a></div>`).join('')}
function tabs(){
 const T=D.tables||{};let ks=Object.keys(T).filter(k=>T[k].rows.length&&T[k].mine.length);
 if(!ks.length)ks=Object.keys(T).filter(k=>T[k].rows.length);
 if(!ks.includes(cur))cur=ks[0];
 document.getElementById('tabs').innerHTML=ks.map(k=>`<button role="tab" aria-selected="${k===cur}" data-k="${k}">${T[k].title}</button>`).join('');
 const t=T[cur];
 document.getElementById('tbl').innerHTML=t?'<tr><th>#</th><th>Squadra</th><th>G</th><th>Pt</th></tr>'+t.rows.map(r=>`<tr class="${t.mine.includes(r[1])?'me':''}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[3]!=null?r[3]:''}</td><td>${r[2]!=null?r[2]:''}</td></tr>`).join(''):'';
}
function render(){
 cards();tabs();
 document.getElementById('note').hidden=D.src!=='demo';
 const hm=new Date(D.ts||Date.now()).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
 document.getElementById('src').innerHTML=D.src==='demo'?`<span class="err">Dati reali non disponibili${err?': '+err:''}</span>`:`Fonte: ${D.src} · aggiornato ${hm}`+(D.via&&Object.values(D.via).some(v=>v>1)?`<br>via: ${Object.entries(D.via).map(([k,v])=>k+v).join(' ')}`:'')+((D.errors&&D.errors.length)?`<br><span class="err">${D.errors.join(' · ')}</span>`:'');
}
async function load(){
 last=Date.now();
 try{const r=await fetch('/api/data');const j=await r.json();
  if(!r.ok)throw new Error((j.errors||['HTTP '+r.status]).join(' · '));
  D=j;err='';}
 catch(e){D=DEMO;err=e.message;}
 render();
}
document.getElementById('tabs').addEventListener('click',e=>{const k=e.target.dataset.k;if(k){cur=k;tabs()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-last>60000)load()});
setInterval(()=>{if(!document.hidden&&D.teams.some(t=>t.live))load()},60000);
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
