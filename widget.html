<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Squadre · widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0b1220;--mu:#5b667a;--ln:#e3e8f0;--live:#d92d20;--ok:#16a34a;--no:#dc2626;--dr:#94a3b8;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c30;--tx:#eef2f9;--mu:#93a0b8;--ln:#24304a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.25 system-ui,sans-serif;padding:6px;display:flex;flex-direction:column;gap:5px}
a{color:inherit;text-decoration:none}
.r{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c1);border-radius:10px;padding:6px 8px;flex:1;min-height:0}
.tm-inter{--c1:#2563eb}.tm-palermo{--c1:#ec4899}.tm-italia{--c1:#0ea5e9}.tm-winterthur{--c1:#dc2626}
.n{flex:1;min-width:0}
.n b{display:block;font-size:14px}
.n small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{text-align:right;font-weight:800;font-size:17px;line-height:1}
.p small{display:block;font-size:10px;font-weight:500;color:var(--mu)}
.lv{color:var(--live);font-weight:700}
.rs{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;vertical-align:-2px;margin-right:3px}
.rs.V{background:var(--ok)}.rs.P{background:var(--no)}.rs.N{background:var(--dr)}
.ft{color:var(--mu);font-size:10px;text-align:center}
/* widget basso: due colonne e niente ultimo risultato */
@media(max-height:260px){body{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:4px;padding:4px}.ft{display:none}.r{padding:4px 6px}.n small+small{display:none}.n b{font-size:13px}}
</style>
</head>
<body>
<div class="ft" id="ft">Caricamento…</div>
<script>
const $=id=>document.getElementById(id),DAY=864e5;
const hm=t=>new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const sh=t=>{const d=new Date(t);return (d-Date.now())/DAY<6?d.toLocaleDateString('it-IT',{weekday:'short'})+' '+hm(t):d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})};
const dot=r=>`<span class="rs ${r}">${r}</span>`;
let D=null;
function render(){
 document.querySelectorAll('.r').forEach(x=>x.remove());
 const rows=(D?D.teams:[]).map(s=>`<a class="r tm-${s.id}" href="/" target="_top">
<div class="n"><b>${s.name}</b><small>${s.live?`<span class="lv">● ${s.live.score} ${s.live.clock||''}</span> ${s.live.opp}`:s.next?`${s.next.opp} · ${sh(s.next.t)}`:'Nessuna partita'}</small>
<small>${s.last?dot(s.last.res)+s.last.score+' '+s.last.opp:''}</small></div>
<div class="p">${s.pos?s.pos+'°':'–'}<small>${s.pts!=null?s.pts+' pt':''}</small></div></a>`).join('');
 $('ft').insertAdjacentHTML('beforebegin',rows);
}
async function load(){
 try{const r=await fetch('/api/data',{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error((j.errors||['HTTP '+r.status])[0]);
  D=j;render();$('ft').textContent='Aggiornato '+hm(j.ts||Date.now());}
 catch(e){$('ft').textContent='Dati non disponibili'+(D?' · ultimi '+hm(D.ts):'');}
 const live=D&&D.teams.some(t=>t.live);
 clearTimeout(load.t);load.t=setTimeout(load,live?60e3:300e3);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
load();
</script>
</body>
</html>
