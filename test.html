<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Test fonti</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:14px system-ui;margin:12px;background:#0b1220;color:#eef2f9}button{padding:12px 16px;font-size:16px;border-radius:10px;border:0;background:#6ea0ff;color:#0b1220;font-weight:700}pre{white-space:pre-wrap;font-size:12px}</style></head>
<body><button id="c">Copia risultato</button> <span id="s">in corso...</span><pre id="o"></pre>
<script>
const T=['p=203','p=210','e=a&k=standings','e=b&k=standings','e=n&k=standings','e=a&k=scoreboard','e=b&k=scoreboard'];
(async()=>{let out='';
 for(const t of T){let r;try{r=await (await fetch('/api/test?'+t)).text()}catch(e){r='errore rete: '+e.message}
  out+='=== '+t+' ===\n'+r+'\n\n';document.getElementById('o').textContent=out;}
 document.getElementById('s').textContent='fatto';})();
document.getElementById('c').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('o').textContent);document.getElementById('s').textContent='copiato'}catch(e){document.getElementById('s').textContent='copia a mano'}};
</script></body></html>
